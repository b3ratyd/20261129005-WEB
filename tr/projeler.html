<div class="wrap page-head">
  <h1>Projeler</h1>
  <p>Grafik Animasyon I dersi kapsamında hazırladığım çalışmalar.</p>
</div>
<section class="wrap" style="padding-bottom:4rem" aria-label="Proje listesi">
  <div class="plates all"><figure class="plate" id="p1"><a href="#p1"><div class="plate-img"><img src="../assets/img/projects/p1.jpg" alt="Ters Yüz 2 afişi: Photoshop&#x27;ta History Brush (Geçmiş Fırçası) aracını öğrenmek için hazırladığım çalışma. Çok sevdiğim animasyon Ters Yüz 2&#x27;yi seçtim: karakterleri siyah-beyaza çevirip yalnızca Neşe&#x27;nin rengini fırçayla geri getirdim, böylece bakışlar tek bir noktada toplanıyor. Afişi, filmin ruhunu yansıtan özlü bir sözle tamamladım: “Bazen tek bir renk, bütün hikâyeyi anlatmaya yeter.”" width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">History Brush · Photoshop</span><h3>Ters Yüz 2 afişi</h3><p>Photoshop'ta History Brush (Geçmiş Fırçası) aracını öğrenmek için hazırladığım çalışma. Çok sevdiğim animasyon Ters Yüz 2'yi seçtim: karakterleri siyah-beyaza çevirip yalnızca Neşe'nin rengini fırçayla geri getirdim, böylece bakışlar tek bir noktada toplanıyor. Afişi, filmin ruhunu yansıtan özlü bir sözle tamamladım: “Bazen tek bir renk, bütün hikâyeyi anlatmaya yeter.”</p><dl class="pdetail"><div><dt>Amaç</dt><dd>Photoshop&#x27;ta History Brush (Geçmiş Fırçası) aracını öğrenmek.</dd></div><div><dt>Nasıl yaptım</dt><dd>Çok sevdiğim animasyon Ters Yüz 2&#x27;yi seçtim. Karakterleri siyah-beyaza çevirip yalnızca Neşe&#x27;nin rengini fırçayla geri getirdim.</dd></div><div><dt>Sonuç</dt><dd>Bakışlar tek bir noktada toplanıyor. Afişe filmin ruhunu yansıtan özlü bir söz ekledim: “Bazen tek bir renk, bütün hikâyeyi anlatmaya yeter.”</dd></div><div><dt>Araçlar</dt><dd><span class="chip">Photoshop</span><span class="chip">History Brush</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p2"><a href="#p2"><div class="plate-img"><img src="../assets/img/projects/p2.jpg" alt="Fusetea ürün afişi: Bir ürün tanıtımı çalışması: mango ve ananas aromalı içecek için yeşilin her tonunu kullandım. Koyu zeminden yapraklara, yumuşak ışık parıltılarından kutunun metalik yüzeyine kadar tüm renkler aynı aileden; sonuç ferah, canlı ve etkileyici bir tanıtım afişi." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Ürün tanıtımı</span><h3>Fusetea ürün afişi</h3><p>Bir ürün tanıtımı çalışması: mango ve ananas aromalı içecek için yeşilin her tonunu kullandım. Koyu zeminden yapraklara, yumuşak ışık parıltılarından kutunun metalik yüzeyine kadar tüm renkler aynı aileden; sonuç ferah, canlı ve etkileyici bir tanıtım afişi.</p><dl class="pdetail"><div><dt>Amaç</dt><dd>Bir ürünün tanıtımını yapan etkileyici bir afiş hazırlamak.</dd></div><div><dt>Nasıl yaptım</dt><dd>Mango ve ananas aromalı içecek için yeşilin her tonunu kullandım: koyu zeminden yapraklara, yumuşak ışık parıltılarından kutunun metalik yüzeyine kadar.</dd></div><div><dt>Sonuç</dt><dd>Tüm renkler aynı aileden olduğu için ferah, canlı ve etkileyici bir tanıtım afişi çıktı.</dd></div><div><dt>Araçlar</dt><dd><span class="chip">Ürün tanıtımı</span><span class="chip">Yeşil tonları</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p3"><a href="#p3"><div class="plate-img"><img src="../assets/img/projects/p3.jpg" alt="Spawn karakter çalışması: Kara kalem bir çizimin dijital boyaması. Gölgelendirmelerle karaktere hacim verdim, doğru renk seçimleriyle onu sahnenin tam merkezine taşıdım: kırmızı pelerin ve metal detaylar, sade kayalık zeminde öne çıkıyor." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Kara kalem boyama</span><h3>Spawn karakter çalışması</h3><p>Kara kalem bir çizimin dijital boyaması. Gölgelendirmelerle karaktere hacim verdim, doğru renk seçimleriyle onu sahnenin tam merkezine taşıdım: kırmızı pelerin ve metal detaylar, sade kayalık zeminde öne çıkıyor.</p><dl class="pdetail"><div><dt>Amaç</dt><dd>Kara kalem bir çizimi gölgelendirmelerle ve doğru renk seçimleriyle boyamak.</dd></div><div><dt>Nasıl yaptım</dt><dd>Gölgelendirmelerle karaktere hacim verdim. Renkleri, karakter sahnenin odağı olacak şekilde seçtim.</dd></div><div><dt>Sonuç</dt><dd>Kırmızı pelerin ve metal detaylar, sade kayalık zeminde öne çıkıyor.</dd></div><div><dt>Araçlar</dt><dd><span class="chip">Kara kalem boyama</span><span class="chip">Gölgelendirme</span><span class="chip">Renk seçimi</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p5"><a href="#p5"><div class="plate-img"><img src="../assets/img/projects/p5.jpg" alt="Çiftlik oyunu sahnesi: Kendi fikrim olan bir çiftlik oyunu için Smart Object (Akıllı Nesne) tekniğiyle tasarladığım sahne. Tarla, çiçek bahçesi ve hayvan ağılları; inekler, domuzlar, koyunlar, atlar, tavuklar ve bitkiler oyunun dünyasını canlandırıyor. Smart Object sayesinde her öğe kalite kaybı olmadan düzenlenebiliyor." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Smart Object</span><h3>Çiftlik oyunu sahnesi</h3><p>Kendi fikrim olan bir çiftlik oyunu için Smart Object (Akıllı Nesne) tekniğiyle tasarladığım sahne. Tarla, çiçek bahçesi ve hayvan ağılları; inekler, domuzlar, koyunlar, atlar, tavuklar ve bitkiler oyunun dünyasını canlandırıyor. Smart Object sayesinde her öğe kalite kaybı olmadan düzenlenebiliyor.</p><dl class="pdetail"><div><dt>Amaç</dt><dd>Smart Object (Akıllı Nesne) tekniğini kullanarak bir oyun sahnesi tasarlamak.</dd></div><div><dt>Nasıl yaptım</dt><dd>Kendi fikrim olan bir çiftlik oyunu için tarla, çiçek bahçesi ve hayvan ağılları kurdum; inekler, domuzlar, koyunlar, atlar, tavuklar ve bitkiler sahneyi canlandırıyor.</dd></div><div><dt>Sonuç</dt><dd>Smart Object sayesinde her öğe kalite kaybı olmadan düzenlenebiliyor.</dd></div><div><dt>Araçlar</dt><dd><span class="chip">Smart Object</span><span class="chip">Oyun görseli</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p6"><a href="#p6"><div class="plate-img"><img src="../assets/img/projects/p6.jpg" alt="Image Stack: boş cadde: Bir yerin birçok fotoğrafını çektim; karelerde hareketli araçlar vardı. Photoshop&#x27;ta bu fotoğrafları Image Stack (görüntü yığını) tekniğiyle birleştirip hareketli nesneleri kaldırdım. Yol ve bina olduğu gibi kaldı, geçen araçlar silindi." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Image Stack · Photoshop</span><h3>Image Stack: boş cadde</h3><p>Bir yerin birçok fotoğrafını çektim; karelerde hareketli araçlar vardı. Photoshop'ta bu fotoğrafları Image Stack (görüntü yığını) tekniğiyle birleştirip hareketli nesneleri kaldırdım. Yol ve bina olduğu gibi kaldı, geçen araçlar silindi.</p><div class="ba"><figure><img src="../assets/img/projects/p6-once.jpg" alt="Önce: yolda hareketli araçlar" width="450" height="600" loading="lazy"><figcaption>Önce</figcaption></figure><figure><img src="../assets/img/projects/p6.jpg" alt="Sonra: araçlar kaldırılmış boş cadde" width="450" height="600" loading="lazy"><figcaption>Sonra</figcaption></figure></div><dl class="pdetail"><div><dt>Amaç</dt><dd>Image Stack tekniğini öğrenmek: aynı yerin fotoğraflarını birleştirip hareketli nesneleri kaldırmak.</dd></div><div><dt>Nasıl yaptım</dt><dd>Bir yerin birçok fotoğrafını çektim. Karelerde araçlar hareket ediyordu. Fotoğrafları Photoshop&#x27;ta bir yığın (stack) olarak birleştirdim ve hareketli nesneleri kaldırdım.</dd></div><div><dt>Sonuç</dt><dd>Yol ve bina olduğu gibi kaldı, geçen araçlar tamamen silindi: karşımda boş bir cadde fotoğrafı var.</dd></div><div><dt>Araçlar</dt><dd><span class="chip">Photoshop</span><span class="chip">Image Stack</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p4"><a href="#p4"><div class="plate-img"><img src="../assets/img/projects/p4.jpg" alt="Starbucks web sayfası: Starbucks&#x27;ın web sitesinin arayüzünü Photoshop&#x27;ta, gelişmiş tekniklerle ve büyük bir titizlikle tasarladım. Yılbaşı kampanyasına uygun renkler, içecekler / öneriler / kampanyalar şeklinde net bölümler ve okunaklı bir düzen kurdum." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Web arayüzü · Photoshop</span><h3>Starbucks web sayfası</h3><p>Starbucks'ın web sitesinin arayüzünü Photoshop'ta, gelişmiş tekniklerle ve büyük bir titizlikle tasarladım. Yılbaşı kampanyasına uygun renkler, içecekler / öneriler / kampanyalar şeklinde net bölümler ve okunaklı bir düzen kurdum.</p><dl class="pdetail"><div><dt>Amaç</dt><dd>Bir web arayüzü hazırlamak.</dd></div><div><dt>Nasıl yaptım</dt><dd>Starbucks&#x27;ın web sitesinin arayüzünü Photoshop&#x27;ta, gelişmiş tekniklerle ve büyük bir titizlikle tasarladım.</dd></div><div><dt>Sonuç</dt><dd>Yılbaşı kampanyasına uygun renkler, net bölümler (içecekler, öneriler, kampanyalar) ve okunaklı bir düzen çıktı. Bu çalışmayı blogda da anlattım.</dd></div><div><dt>Araçlar</dt><dd><span class="chip">Photoshop</span><span class="chip">Web arayüzü</span></dd></div></dl></figcaption></a></figure></div>
</section>
