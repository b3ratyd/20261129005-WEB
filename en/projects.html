<div class="wrap page-head">
  <h1>Projects</h1>
  <p>Work I prepared for the Graphic Animation I course.</p>
</div>
<section class="wrap" style="padding-bottom:4rem" aria-label="Project list">
  <div class="plates all"><figure class="plate" id="p1"><a href="#p1"><div class="plate-img"><img src="../assets/img/projects/p1.jpg" alt="Inside Out 2 poster: A study in Photoshop&#x27;s History Brush tool. I chose Inside Out 2, an animation I love: I turned the characters black and white and painted only Joy&#x27;s colour back in, so every eye lands on one spot. I finished the poster with a line in the film&#x27;s spirit: “Sometimes a single colour is enough to tell the whole story.”" width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">History Brush · Photoshop</span><h3>Inside Out 2 poster</h3><p>A study in Photoshop's History Brush tool. I chose Inside Out 2, an animation I love: I turned the characters black and white and painted only Joy's colour back in, so every eye lands on one spot. I finished the poster with a line in the film's spirit: “Sometimes a single colour is enough to tell the whole story.”</p><dl class="pdetail"><div><dt>Goal</dt><dd>Learning Photoshop&#x27;s History Brush tool.</dd></div><div><dt>How I did it</dt><dd>I chose Inside Out 2, an animation I love. I turned the characters black and white and painted only Joy&#x27;s colour back in with the brush.</dd></div><div><dt>Result</dt><dd>Every eye lands on one spot. I added a line in the film&#x27;s spirit to the poster: “Sometimes a single colour is enough to tell the whole story.”</dd></div><div><dt>Tools</dt><dd><span class="chip">Photoshop</span><span class="chip">History Brush</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p2"><a href="#p2"><div class="plate-img"><img src="../assets/img/projects/p2.jpg" alt="Fusetea product poster: A product promotion piece: I used every shade of green for a mango and pineapple flavoured drink. From the dark background to the leaves, from soft light bokeh to the can&#x27;s metallic surface, every colour belongs to one family. The result is a fresh, vivid and striking promo poster." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Product promotion</span><h3>Fusetea product poster</h3><p>A product promotion piece: I used every shade of green for a mango and pineapple flavoured drink. From the dark background to the leaves, from soft light bokeh to the can's metallic surface, every colour belongs to one family. The result is a fresh, vivid and striking promo poster.</p><dl class="pdetail"><div><dt>Goal</dt><dd>Making an impressive poster that promotes a product.</dd></div><div><dt>How I did it</dt><dd>I used every shade of green for a mango and pineapple drink: from the dark background to the leaves, from soft light bokeh to the can&#x27;s metallic surface.</dd></div><div><dt>Result</dt><dd>Because every colour belongs to one family, the result is a fresh, vivid and striking promo poster.</dd></div><div><dt>Tools</dt><dd><span class="chip">Product promotion</span><span class="chip">Shades of green</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p3"><a href="#p3"><div class="plate-img"><img src="../assets/img/projects/p3.jpg" alt="Spawn character study: A digital colouring of a pencil drawing. I gave the character volume with shading and, through careful colour choices, made him the focus of the scene: the red cape and metal details stand out against the plain rocky ground." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Pencil-art colouring</span><h3>Spawn character study</h3><p>A digital colouring of a pencil drawing. I gave the character volume with shading and, through careful colour choices, made him the focus of the scene: the red cape and metal details stand out against the plain rocky ground.</p><dl class="pdetail"><div><dt>Goal</dt><dd>Colouring a pencil drawing with shading and careful colour choices.</dd></div><div><dt>How I did it</dt><dd>I gave the character volume with shading and chose the colours so that he becomes the focus of the scene.</dd></div><div><dt>Result</dt><dd>The red cape and metal details stand out against the plain rocky ground.</dd></div><div><dt>Tools</dt><dd><span class="chip">Pencil-art colouring</span><span class="chip">Shading</span><span class="chip">Colour choice</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p5"><a href="#p5"><div class="plate-img"><img src="../assets/img/projects/p5.jpg" alt="Farm game scene: A scene I designed with the Smart Object technique for a farm game of my own. Fields, a flower garden and animal pens: cows, pigs, sheep, horses, chickens and plants bring the game&#x27;s world to life. Thanks to Smart Objects, every element can be edited without losing quality." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Smart Object</span><h3>Farm game scene</h3><p>A scene I designed with the Smart Object technique for a farm game of my own. Fields, a flower garden and animal pens: cows, pigs, sheep, horses, chickens and plants bring the game's world to life. Thanks to Smart Objects, every element can be edited without losing quality.</p><dl class="pdetail"><div><dt>Goal</dt><dd>Designing a game scene with the Smart Object technique.</dd></div><div><dt>How I did it</dt><dd>For a farm game idea of my own I built fields, a flower garden and animal pens; cows, pigs, sheep, horses, chickens and plants bring the scene to life.</dd></div><div><dt>Result</dt><dd>Thanks to Smart Objects, every element can be edited without losing quality.</dd></div><div><dt>Tools</dt><dd><span class="chip">Smart Object</span><span class="chip">Game art</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p6"><a href="#p6"><div class="plate-img"><img src="../assets/img/projects/p6.jpg" alt="Image Stack: an empty street: I took many photos of one place, and moving cars kept crossing the frame. In Photoshop I combined the photos with the Image Stack technique and removed the moving objects. The road and the building stayed, the passing cars vanished." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Image Stack · Photoshop</span><h3>Image Stack: an empty street</h3><p>I took many photos of one place, and moving cars kept crossing the frame. In Photoshop I combined the photos with the Image Stack technique and removed the moving objects. The road and the building stayed, the passing cars vanished.</p><div class="ba"><figure><img src="../assets/img/projects/p6-once.jpg" alt="Before: moving cars on the road" width="450" height="600" loading="lazy"><figcaption>Before</figcaption></figure><figure><img src="../assets/img/projects/p6.jpg" alt="After: the empty street, cars removed" width="450" height="600" loading="lazy"><figcaption>After</figcaption></figure></div><dl class="pdetail"><div><dt>Goal</dt><dd>Learning the Image Stack technique: combining photos of one place to remove moving objects.</dd></div><div><dt>How I did it</dt><dd>I took many photos of one place, with cars moving through the frames. In Photoshop I combined the photos as a stack and removed the moving objects.</dd></div><div><dt>Result</dt><dd>The road and the building stayed, the passing cars vanished completely: I ended up with a photo of an empty street.</dd></div><div><dt>Tools</dt><dd><span class="chip">Photoshop</span><span class="chip">Image Stack</span></dd></div></dl></figcaption></a></figure><figure class="plate" id="p4"><a href="#p4"><div class="plate-img"><img src="../assets/img/projects/p4.jpg" alt="Starbucks web page: I designed the interface of Starbucks&#x27; website in Photoshop with advanced techniques and great care: festive campaign colours, clear sections for drinks, recommendations and offers, and a readable layout." width="800" height="1000" loading="lazy"></div><figcaption><span class="plate-tag">Web interface · Photoshop</span><h3>Starbucks web page</h3><p>I designed the interface of Starbucks' website in Photoshop with advanced techniques and great care: festive campaign colours, clear sections for drinks, recommendations and offers, and a readable layout.</p><dl class="pdetail"><div><dt>Goal</dt><dd>Preparing a web interface.</dd></div><div><dt>How I did it</dt><dd>I designed the interface of Starbucks&#x27; website in Photoshop with advanced techniques and great care.</dd></div><div><dt>Result</dt><dd>The result has festive campaign colours, clear sections (drinks, recommendations, offers) and a readable layout. I also wrote about this work on my blog.</dd></div><div><dt>Tools</dt><dd><span class="chip">Photoshop</span><span class="chip">Web interface</span></dd></div></dl></figcaption></a></figure></div>
</section>
